name: Perfume embeddings

# Precomputes the perfume recommender's embeddings and commits them, so the notebook can download
# them instead of embedding ~24,000 perfumes in every fresh Colab session.
on:
  push:
    branches: [main]
    paths:
      - "perfumerecom/fragrantica.xlsx"
      - "perfumerecom/Perfume_Recommender_Decision1.ipynb"
      - "perfumerecom/build_embeddings.py"
      - ".github/workflows/perfume-embeddings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfume-embeddings
  cancel-in-progress: true

jobs:
  embed:
    name: Build and commit embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -U sentence-transformers transformers pandas openpyxl numpy

      - name: Build embeddings
        run: python perfumerecom/build_embeddings.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfumerecom/perfume_embeddings_*.npy perfumerecom/perfume_embeddings_*.npy.sha256
          if git diff --cached --quiet; then
            echo "Embeddings are already up to date."
          else
            git commit -m "Update precomputed perfume embeddings"
            git push
          fi
