name: TRIBE v2 CI

on:
  push:
    paths:
      - "tribev2/**"
      - ".github/workflows/tribev2-ci.yml"
  pull_request:
    paths:
      - "tribev2/**"
      - ".github/workflows/tribev2-ci.yml"

defaults:
  run:
    working-directory: tribev2

jobs:
  test:
    name: Unit tests and RCT dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tribev2/requirements-ci.txt

      - name: Install harness (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest -q -m "not gpu"

      - name: Validate RCT dataset generation
        run: python scripts/run_framing_rct.py --generate-only

      - name: Environment check (JSON)
        run: python scripts/check_environment.py --json
