name: TRIBE v2 Framing GPU

# GitHub-hosted GPU larger runners are billed per minute (not included in free
# Actions minutes). This workflow targets a Tesla T4 (16 GB VRAM) and runs a
# reduced smoke test. Full 8-scenario inference needs ~40 GB VRAM (A100).

on:
  workflow_dispatch:
    inputs:
      max_scenarios:
        description: Number of scenario pairs to run (smoke test)
        required: false
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
      runner_label:
        description: GPU runner label (set repo variable GPU_RUNNER_LABEL to override)
        required: false
        default: "ubuntu-22.04-gpu"
        type: string

  pull_request:
    types: [labeled]

concurrency:
  group: tribev2-gpu-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tribev2

jobs:
  framing-gpu:
    name: Kahneman framing inference
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-gpu'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || vars.GPU_RUNNER_LABEL || 'ubuntu-22.04-gpu' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify NVIDIA GPU
        run: |
          nvidia-smi
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["nvidia-smi", "--query-gpu=name,memory.total", "--format=csv,noheader,nounits"],
              capture_output=True,
              text=True,
              check=True,
          )
          name, memory_mb = [part.strip() for part in result.stdout.split(",", maxsplit=1)]
          vram_gb = float(memory_mb) / 1024
          print(f"GPU: {name} ({vram_gb:.1f} GB VRAM)")
          if vram_gb < 15:
              sys.exit("No usable GPU detected on this runner.")
          if vram_gb < 35:
              print(
                  "WARNING: TRIBE v2 full trimodal inference recommends >=40 GB VRAM. "
                  "Running a reduced smoke test; expect possible OOM on T4 (16 GB)."
              )
          PY

      - name: Cache pip and model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            tribev2/cache
            ~/.cache/huggingface
          key: tribev2-gpu-${{ runner.os }}-${{ hashFiles('tribev2/requirements-gpu.txt') }}
          restore-keys: |
            tribev2-gpu-${{ runner.os }}-

      - name: Install GPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt
          pip install -e .

      - name: Hugging Face login
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is required for text inference (LLaMA 3.2)." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import login

          login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)
          print("Hugging Face authentication OK")
          PY

      - name: Run framing RCT smoke test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: "600"
          HF_HUB_HTTP_TIMEOUT: "600"
        run: |
          MAX_SCENARIOS="${{ github.event.inputs.max_scenarios || '2' }}"
          python scripts/run_framing_rct.py \
            --preload-llama \
            --max-scenarios "$MAX_SCENARIOS"

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framing-rct-report
          path: |
            tribev2/outputs/reports/framing_rct_analysis.json
          if-no-files-found: warn
