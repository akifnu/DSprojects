name: Reel pipeline CI

on:
  push:
    paths:
      - 'reel-pipeline/**'
      - '.claude/agents/**'
      - '.claude/workflows/reel-job.js'
      - '.claude/skills/reel-production/**'
      - '.github/workflows/reel-pipeline-ci.yml'
  pull_request:
    paths:
      - 'reel-pipeline/**'
      - '.claude/agents/**'
      - '.claude/workflows/reel-job.js'
      - '.claude/skills/reel-production/**'
      - '.github/workflows/reel-pipeline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reel-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reel-pipeline
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reel-pipeline/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation
          python -m pip install -r requirements.txt -r requirements-url.txt
      - uses: actions/cache@v4
        with:
          path: |
            reel-pipeline/.tools
            reel-pipeline/.models
            reel-pipeline/data/fonts
          key: reel-tests-v1-${{ runner.os }}-${{ hashFiles('reel-pipeline/tests/bootstrap.sh') }}
      - name: Prepare media tools and font fixtures
        run: bash tests/bootstrap.sh
      - name: Check Python syntax
        run: python -m compileall -q reelkit tests
      - name: Run required editing and runtime regressions
        env:
          REELKIT_OFFLINE: '1'
        run: |
          set -o pipefail
          python tests/run_suite.py --suite core -v 2>&1 | tee core-results.log
      - name: Caption style analysis diagnostics (known baseline failures)
        continue-on-error: true
        env:
          REELKIT_OFFLINE: '1'
        run: |
          set -o pipefail
          python tests/run_suite.py --suite analysis -v 2>&1 | tee analysis-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-pipeline-test-results
          path: reel-pipeline/*-results.log
          if-no-files-found: ignore
