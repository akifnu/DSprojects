model:
  checkpoint: facebook/tribev2
  cache_folder: ./cache

hardware:
  min_vram_gb: 40
  recommended_vram_gb: 80

huggingface:
  llama_repo: meta-llama/Llama-3.2-3B
  download_timeout_seconds: 300

inference:
  # Predictions peak ~5s after stimulus onset (hemodynamic lag).
  visualization_timestep: 5
  expected_vertices: 20484
  vertices_per_hemisphere: 10242

benchmarks:
  language_vs_visual:
    enabled: true
    stimulus_a: stimuli/language_content.txt
    stimulus_b: stimuli/visual_spatial_content.txt

  modalities:
    text:
      enabled: true
      stimulus: stimuli/language_content.txt
    audio:
      enabled: false
      stimulus: stimuli/sample_audio.wav
    video:
      enabled: false
      stimulus: stimuli/sample_video.mp4

reporting:
  output_dir: ./outputs/reports

framing_rct:
  enabled: true
  protocol: data/framing_rct/scenarios.json
  output_dir: data/framing_rct
  n_subjects: 60
  random_seed: 42
